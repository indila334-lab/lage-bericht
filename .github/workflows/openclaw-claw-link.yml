name: Aeza AmneziaWG Package Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/openclaw-claw-link.yml"

jobs:
  check-amneziawg:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check AmneziaWG package on Aeza
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 12m
          script: |
            set +e
            echo "SSH_OK"
            whoami
            hostname
            uname -a

            echo "--- apt update ---"
            apt-get update

            echo "--- install helper packages ---"
            DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common python3-launchpadlib gnupg2 curl ca-certificates

            echo "--- add Amnezia PPA ---"
            add-apt-repository -y ppa:amnezia/ppa

            echo "--- apt update after PPA ---"
            apt-get update

            echo "--- search amnezia packages ---"
            apt-cache search amnezia | head -50

            echo "--- policy amneziawg ---"
            apt-cache policy amneziawg

            echo "AMNEZIAWG_PACKAGE_CHECK_DONE"
            exit 0
