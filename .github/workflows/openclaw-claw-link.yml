name: Aeza AmneziaWG Setup

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/openclaw-claw-link.yml"

jobs:
  setup-amneziawg:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Test SSH to Aeza
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 8m
          script: |
            set +e
            echo "SSH_OK"
            whoami || true
            hostname || true
            echo "AMNEZIAWG_TEST_READY"
            exit 0
